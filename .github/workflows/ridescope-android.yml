name: RideScope Android APK

on:
  push:
    paths:
      - "ridescope/**"
      - ".github/workflows/ridescope-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ridescope-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ridescope
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional stable signing key. Without these secrets the APK is signed
      # with a throwaway debug key, so each new build must be installed after
      # uninstalling the previous one.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Tester build: the Licence screen can unlock Plus/Pro on the device.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=RIDESCOPE_TESTER=true
          cp build/app/outputs/flutter-apk/app-release.apk "RideScope-tester-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RideScope-tester-build${{ github.run_number }}
          path: ridescope/RideScope-tester-build${{ github.run_number }}.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ridescope-build-${{ github.run_number }}
          name: RideScope tester build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ridescope/RideScope-tester-build${{ github.run_number }}.apk
          body: |
            Tester build of RideScope (Android, sideload).

            Install: open this page on the phone, download the APK, allow
            "Install unknown apps" for your browser when asked.

            Tester builds can unlock Plus/Pro under Settings › Licence.
            Commit: ${{ github.sha }}
